version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cucinecrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cucinecrm_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - cucinecrm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cucinecrm-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cucinecrm.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # L'API viene aggiunta al compose una volta completato anche il Dockerfile
  # (verrà fatto insieme al frontend, così un unico docker-compose avvia tutto lo stack).

volumes:
  cucinecrm_pgdata:
